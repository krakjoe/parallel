name: Linux

permissions:
  contents: read
  pull-requests: read

on:
  pull_request: null
  push:
    branches:
      - master
      - develop
      - release
  schedule:
    - cron: "30 4 * * *"

env:
  NODE_COVERALLS_DEBUG: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        version: ["8.0", "8.1", "8.2", "8.3", "8.4", "8.5"]
        build: ["gcov", "release"]
        mode:
          - name: vanilla
            args: ""
          - name: opcache
            args: -d opcache.enable_cli=1 -d opcache.jit=disable
          - name: jit
            args: -d opcache.enable_cli=1 -d opcache.jit=function -d opcache.jit_buffer_size=32M
    runs-on: ubuntu-latest
    name: Linux, PHP v${{ matrix.version }}, ${{ matrix.build }}, ${{ matrix.mode.name }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.version }}
          ini-file: development
          coverage: none
          tools: none
        env:
          phpts: zts

      - name: Install lcov
        if: ${{ matrix.build == 'gcov' }}
        run: |
          sudo apt-get update
          sudo apt-get install -y lcov

      - name: Build parallel
        run: |
          php -v
          phpize
          ./configure --enable-parallel \
            --$(test "${{ matrix.build }}" = gcov && echo enable || echo disable)-parallel-gcov
          make -j$(nproc)
          sudo make install
          echo "extension=parallel.so" | sudo tee -a "$(php -r 'echo php_ini_loaded_file();')"
          php -m

      - name: Test parallel
        env:
          REPORT_EXIT_STATUS: 1
          ZEND_DONT_UNLOAD_MODULES: 1
        run: |
          php run-tests.php \
            -P \
            -q \
            -g FAIL,XFAIL,XLEAK,SKIP,BORK,LEAK \
            --show-diff \
            ${{ matrix.mode.args }}

      - name: Generate Coverage
        if: ${{ matrix.build == 'gcov' }}
        run: |
          lcov --capture \
            --directory src/.libs \
            --exclude '/usr/*' \
            --ignore-errors inconsistent,mismatch,unused \
            --output-file coverage.info
          sed -i "s|${{ github.workspace }}/||g" coverage.info

      - name: Send Coverage
        if: ${{ matrix.build == 'gcov' }}
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path-to-lcov: ${{ github.workspace }}/coverage.info
          flag-name: ${{ matrix.mode.name }}-${{ matrix.version }}
          parallel: true

  finish:
    if: always()
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Finish Coveralls
        uses: coverallsapp/github-action@v2.3.8
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          parallel-finished: true
