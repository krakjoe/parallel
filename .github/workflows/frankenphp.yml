name: FrankenPHP

permissions:
  contents: read
  pull-requests: read

on:
  pull_request: null
  push:
    branches:
      - master
      - develop
      - release

jobs:
  test:
    runs-on: ubuntu-latest
    name: Output bailout recovery
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test aborted output
        run: docker/frankenphp.test
