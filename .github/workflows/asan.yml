name: ASAN

permissions:
  contents: read
  pull-requests: read

on:
  pull_request: null
  push:
    branches:
      - master
      - develop
      - release
  schedule:
    - cron: "30 4 * * *"

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        version: ["8.1", "8.2", "8.3", "8.4", "8.5"]
        mode:
          - name: vanilla
            args: ""
          - name: opcache
            args: -d opcache.enable_cli=1 -d opcache.jit=disable
          - name: jit
            args: -d opcache.enable_cli=1 -d opcache.jit=function -d opcache.jit_buffer_size=32M
          - name: tracing jit
            args: -d opcache.enable_cli=1 -d opcache.jit=tracing -d opcache.jit_buffer_size=32M
    runs-on: ubuntu-latest
    name: ASAN, PHP v${{matrix.version}}, ${{matrix.mode.name}}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Test parallel
        run: PHP_BUILD=asan PHP_VERSION=${{matrix.version}} docker compose run --rm parallel docker/parallel.test ${{matrix.mode.args}} --asan
