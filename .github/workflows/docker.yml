name: Docker

permissions:
  contents: read
  pull-requests: read

on: [workflow_dispatch]

jobs:
  docker:
    name: PHP v${{ matrix.php.major }}.${{ matrix.php.minor }}, ${{ matrix.flags.name }}
    runs-on: ubuntu-latest
    permissions:
      packages: write
    strategy:
      matrix:
        php:
          - major: 8
            minor: 0
            patch: 30
            rc: ''
          - major: 8
            minor: 1
            patch: 31
            rc: ''
          - major: 8
            minor: 2
            patch: 26
            rc: ''
          - major: 8
            minor: 3
            patch: 14
            rc: ''
          - major: 8
            minor: 4
            patch: 1
            rc: ''
          - major: 8
            minor: 5
            patch: 8
            rc: ''
        flags:
          - name: asan
            debug: disable
            asan: enable
            tsan: disable
            gcov: disable
          - name: dbg
            debug: enable
            asan: disable
            tsan: disable
            gcov: disable
          - name: gcov
            debug: disable
            asan: disable
            tsan: disable
            gcov: enable
          - name: release
            debug: disable
            asan: disable
            tsan: disable
            gcov: disable
        exclude:
          - php: {major: 8, minor: 0}
            flags: {name: asan}
        include:
          - php: {major: 8, minor: 5, patch: 8, rc: ''}
            flags: {name: tsan, debug: disable, asan: disable, tsan: enable, gcov: disable}

    steps:
      - name: Prepare build variables
        id: build-vars
        run: |
          echo "repository=ghcr.io/${{ github.repository_owner }}/php-${{ matrix.flags.name }}-${{ matrix.php.major }}.${{ matrix.php.minor }}" >> $GITHUB_OUTPUT
          echo "version=${{ matrix.php.major }}.${{ matrix.php.minor }}.${{ matrix.php.patch }}${{ matrix.php.rc }}" >> $GITHUB_OUTPUT

      - name: Repository checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # https://docs.docker.com/build/ci/github-actions/cache/
      - name: Build and export Docker Image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          load: true
          build-args: |
            "PHP_SRC_TYPE=dist"
            "PHP_SRC_DEBUG=${{ matrix.flags.debug }}"
            "PHP_SRC_ASAN=${{ matrix.flags.asan }}"
            "PHP_SRC_TSAN=${{ matrix.flags.tsan }}"
            "PHP_SRC_GCOV=${{ matrix.flags.gcov }}"
            "PHP_VERSION_MAJOR=${{ matrix.php.major }}"
            "PHP_VERSION_MINOR=${{ matrix.php.minor }}"
            "PHP_VERSION_PATCH=${{ matrix.php.patch }}"
            "PHP_VERSION_RC=${{ matrix.php.rc }}"
          tags: |
            ${{ steps.build-vars.outputs.repository }}:latest
            ${{ steps.build-vars.outputs.repository }}:${{ steps.build-vars.outputs.version }}
          file: ./docker/php.dockerfile
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # https://docs.docker.com/build/ci/github-actions/test-before-push/
      - name: Test Docker Image
        run: |
          if [ "${{ matrix.flags.name }}" = tsan ]; then
            docker run --rm --security-opt seccomp=unconfined ${{ steps.build-vars.outputs.repository }}:latest php --version
          else
            docker run --rm ${{ steps.build-vars.outputs.repository }}:latest php --version
          fi

      - name: Push Docker Image
        run: docker push --all-tags ${{ steps.build-vars.outputs.repository }}
